<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — Warden</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="brand">
  <div>
    <div class="mark">Ward<em>en</em></div>
    <h1>Your identity, verified.</h1>
    <p class="tag">Recover access to your account.</p>
    <svg class="seal" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="52" fill="none" stroke="#c9a227" stroke-width="1.2" opacity="0.55"/>
      <circle cx="60" cy="60" r="42" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.4"/>
      <circle cx="60" cy="60" r="4" fill="#c9a227"/>
      <g stroke="#c9a227" stroke-width="1" opacity="0.5">
        <line x1="60" y1="8" x2="60" y2="18"/><line x1="60" y1="102" x2="60" y2="112"/>
        <line x1="8" y1="60" x2="18" y2="60"/><line x1="102" y1="60" x2="112" y2="60"/>
      </g>
    </svg>
  </div>
  <div class="foot">Warden Auth</div>
</div>

<main>
  <div class="box">

    <div id="step-request">
      <h2>Reset your password</h2>
      <div class="sub">Enter your email and we'll send a reset link if the account exists.</div>
      <div class="field"><label>Email</label><input id="email" type="email"></div>
      <button class="cta" id="requestBtn" onclick="forgotPassword()">Send reset link</button>
      <div class="msg" id="msg-request"></div>
      <div class="foot-links">
        <div style="margin-bottom:6px;"><button class="link-btn" onclick="showConfirm()">I already have a reset token</button></div>
        <div>Remembered it? <a href="login.html">Sign in</a></div>
      </div>
    </div>

    <div id="step-confirm" style="display:none">
      <h2>Set a new password</h2>
      <div class="sub">Paste the token from your reset email, then choose a new password.</div>
      <div class="field"><label>Reset token</label><input id="token"></div>
      <div class="field"><label>New password</label><input id="newPassword" type="password" autocomplete="new-password"></div>
      <button class="cta" id="confirmBtn" onclick="resetPassword()">Set new password</button>
      <div class="msg" id="msg-confirm"></div>
      <div class="foot-links">
        <button class="link-btn" onclick="showRequest()">Back</button>
      </div>
    </div>

  </div>
</main>

<script src="js/auth.js"></script>
<script>
  function showConfirm(){ document.getElementById('step-request').style.display='none'; document.getElementById('step-confirm').style.display='block'; }
  function showRequest(){ document.getElementById('step-confirm').style.display='none'; document.getElementById('step-request').style.display='block'; }

  async function forgotPassword(){
    const btn = document.getElementById('requestBtn');
    btn.disabled = true;
    const {ok, data} = await callAuthApi('/api/v1/auth/forgot-password', {email: v('email')});
    btn.disabled = false;
    setMsg('msg-request', ok, ok ? (data.message || 'If the account exists, a reset link has been sent.') : (data.message || 'Something went wrong.'));
  }

  async function resetPassword(){
    const btn = document.getElementById('confirmBtn');
    btn.disabled = true;
    const {ok, data} = await callAuthApi('/api/v1/auth/reset-password', {token: v('token'), newPassword: v('newPassword')});
    btn.disabled = false;
    setMsg('msg-confirm', ok, ok ? 'Password reset. You can sign in now.' : (data.message || 'That token is invalid or expired.'));
  }
</script>
</body>
</html>
