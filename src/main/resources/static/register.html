<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account — Warden</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="brand">
  <div>
    <div class="mark">Ward<em>en</em></div>
    <h1>Your identity, verified.</h1>
    <p class="tag">Create an account to get started.</p>
    <svg class="seal" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="52" fill="none" stroke="#c9a227" stroke-width="1.2" opacity="0.55"/>
      <circle cx="60" cy="60" r="42" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.4"/>
      <circle cx="60" cy="60" r="4" fill="#c9a227"/>
      <g stroke="#c9a227" stroke-width="1" opacity="0.5">
        <line x1="60" y1="8" x2="60" y2="18"/><line x1="60" y1="102" x2="60" y2="112"/>
        <line x1="8" y1="60" x2="18" y2="60"/><line x1="102" y1="60" x2="112" y2="60"/>
      </g>
    </svg>
  </div>
  <div class="foot">Warden Auth</div>
</div>

<main>
  <div class="box">
    <h2>Create your account</h2>
    <div class="sub">Takes a minute.</div>

    <div class="field"><label>First name</label><input id="firstName"></div>
    <div class="field"><label>Last name</label><input id="lastName"></div>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="new-password"></div>
    <div class="field"><label>Phone number</label><input id="phoneNumber" type="tel"></div>
    <button class="cta" id="submitBtn" onclick="register()">Create account</button>
    <div class="msg" id="msg"></div>

    <div class="foot-links">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
<script>
  async function register(){
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    const {ok, data} = await callAuthApi('/api/v1/auth/register', {
      firstName: v('firstName'), lastName: v('lastName'),
      email: v('email'), password: v('password'), phoneNumber: v('phoneNumber')
    });
    btn.disabled = false;
    setMsg('msg', ok, ok ? 'Account created. You can sign in now.' : (data.message || 'Registration failed.'));
  }
</script>
</body>
</html>
